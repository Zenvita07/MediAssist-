
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediAssist Logo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
}

.logo-container {
    width: 100%;
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
    text-align: center;
}

.logo-container svg {
    width: 100%;
    height: auto;
    display: block;
}

.brand-name {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -2px;
}

.tagline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #073c7a;
    font-size: clamp(13px, 3.5vw, 21px);
    font-weight: bold;
    white-space: nowrap;
}

.tagline span {
    height: 4px;
    background: #16ad9c;
    flex: 1;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="logo-container">

<svg viewBox="0 0 600 460"
xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="medical" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0875b5"/>
<stop offset="100%" stop-color="#12b99b"/>
</linearGradient>

<linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#07509a"/>
<stop offset="100%" stop-color="#087bb8"/>
</linearGradient>
</defs>

<!-- Heart -->
<path d="M300 175
C235 95 145 65 105 125
C65 190 115 260 185 300"
fill="none" stroke="url(#medical)"
stroke-width="13" stroke-linecap="round"/>

<path d="M300 175
C365 95 455 65 495 125
C535 190 485 260 415 300"
fill="none" stroke="url(#medical)"
stroke-width="13" stroke-linecap="round"/>

<!-- Medical Cross -->
<path d="M255 105 H345 V155 H395 V245
H345 V295 H255 V245 H205 V155 H255 Z"
fill="url(#medical)"/>

<!-- Doctor -->
<circle cx="300" cy="150" r="25" fill="white"/>

<!-- Stethoscope -->
<path d="M270 185
C245 220 265 260 300 265
C335 260 355 220 330 185"
fill="none" stroke="#073c7a"
stroke-width="10" stroke-linecap="round"/>

<path d="M300 265 V275"
stroke="#073c7a" stroke-width="9"/>

<circle cx="300" cy="285" r="15"
fill="white" stroke="#073c7a" stroke-width="8"/>

<circle cx="300" cy="285" r="5" fill="#12a99d"/>

<!-- Heartbeat -->
<path d="M405 220 H455 L470 190
L485 265 L505 170 L520 235
L535 210 L550 220 H590"
fill="none" stroke="#12ad9b"
stroke-width="9" stroke-linecap="round"
stroke-linejoin="round"/>

<!-- Helping Hand -->
<path d="M105 335
C145 300 185 300 225 315
L280 335
C310 345 340 330 370 310
L415 290
C445 280 465 300 440 320
L375 365
C325 395 265 390 215 370
L155 350
C135 345 120 340 105 335 Z"
fill="url(#hand)"/>

<path d="M205 340
C250 355 285 370 315 360
C345 350 365 330 390 320"
fill="none" stroke="white"
stroke-width="7" stroke-linecap="round"/>

<!-- Brand Name -->
<text x="300" y="435"
text-anchor="middle"
font-family="Arial, sans-serif"
font-size="65"
font-weight="bold"
letter-spacing="-2">

<tspan fill="#073c7a">Medi</tspan><tspan fill="#079eaa">Assist</tspan>
</text>

</svg>

<div class="tagline">
<span></span>
Your Health, Our Priority
<span></span>
</div>

</div>

</body>
</html>
