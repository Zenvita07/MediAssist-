
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediAssist - Registration</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f8f6;color:#17324d}
header{background:#0878bd;color:white;text-align:center;padding:20px}
header h1{margin:0}
header p{margin:7px 0 0}
.language{text-align:center;padding:15px}
.language select{padding:10px;border-radius:8px}
.container{max-width:750px;margin:15px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;box-shadow:0 3px 14px #0001}
h2{text-align:center;color:#0878bd}
.choice{display:flex;gap:12px;flex-wrap:wrap}
button{font-size:15px;cursor:pointer}
.choice button{flex:1;min-width:130px;padding:14px;border:0;border-radius:9px;color:white;background:#0878bd}
form{display:none}
form.active{display:block}
label{display:block;margin-top:13px;font-weight:bold}
input,form select{width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5df;border-radius:8px;background:white}
.submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#159b68;color:white;font-weight:bold}
.back{background:#e8f3f9;color:#0878bd;border:0;padding:10px 15px;border-radius:8px}
.note{font-size:13px;color:#657786;line-height:1.5}
footer{text-align:center;padding:20px;color:#607080}
</style>
</head>
<body>

<header>
<h1>MediAssist</h1>
<p data-t="tagline">Your Health, Our Support</p>
</header>

<div class="language">
<label for="language" data-t="language">Choose Language</label>
<select id="language">
<option value="en">English</option>
<option value="gu">ગુજરાતી</option>
<option value="hi">हिन्दी</option>
</select>
</div>

<div class="container">
<div class="card">

<div id="selection">
<h2 data-t="registration">Registration</h2>
<p style="text-align:center" data-t="choose">Choose your registration type</p>
<div class="choice">
<button onclick="showForm('patient')" data-t="patient">Patient Registration</button>
<button onclick="showForm('doctor')" data-t="doctor">Doctor Registration</button>
</div>
</div>

<form id="patientForm">
<button type="button" class="back" onclick="goBack()" data-t="back">← Back</button>
<h2 data-t="patient">Patient Registration</h2>

<label data-t="name">Full Name</label>
<input type="text" required>

<label data-t="address">Full Address</label>
<input type="text" required>

<label data-t="city">City</label>
<input type="text" required>

<label data-t="district">District</label>
<input type="text" required>

<label data-t="mobile">Mobile Number</label>
<input type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>

<label data-t="email">Email</label>
<input type="email" required>

<label data-t="dob">Date of Birth</label>
<input type="date" required>

<label data-t="gender">Gender</label>
<select required>
<option value="" data-t="selectGender">Select Gender</option>
<option value="Male" data-t="male">Male</option>
<option value="Female" data-t="female">Female</option>
<option value="Other" data-t="other">Other</option>
</select>

<label data-t="blood">Blood Group (Optional)</label>
<select>
<option value="" data-t="selectBlood">Select Blood Group</option>
<option>A+</option><option>A-</option><option>B+</option><option>B-</option>
<option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
</select>

<label data-t="emergency">Emergency Contact Number</label>
<input type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>

<label data-t="aadhaar">Aadhaar Number (Optional)</label>
<input type="text" inputmode="numeric" maxlength="12" pattern="[0-9]{12}">

<label data-t="password">Password</label>
<input type="password" id="patientPassword" minlength="8" required>

<label data-t="confirm">Confirm Password</label>
<input type="password" id="patientConfirm" minlength="8" required>

<p class="note" data-t="passwordNote">Use a password different from your mobile number.</p>
<button class="submit" type="submit" data-t="createPatient">Create Patient Account</button>
</form>

<form id="doctorForm">
<button type="button" class="back" onclick="goBack()" data-t="back">← Back</button>
<h2 data-t="doctor">Doctor Registration</h2>

<label data-t="name">Full Name</label>
<input type="text" required>

<label data-t="mobile">Mobile Number</label>
<input type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>

<label data-t="email">Email</label>
<input type="email" required>

<label data-t="gender">Gender</label>
<select required>
<option value="" data-t="selectGender">Select Gender</option>
<option value="Male" data-t="male">Male</option>
<option value="Female" data-t="female">Female</option>
<option value="Other" data-t="other">Other</option>
</select>

<label data-t="clinicAddress">Clinic / Hospital Address</label>
<input type="text" required>

<label data-t="city">City</label>
<input type="text" required>

<label data-t="district">District</label>
<input type="text" required>

<label data-t="specialization">Specialization</label>
<select id="specialization" required>
<option value="" data-t="selectSpecialization">Select Specialization</option>
</select>

<label data-t="experience">Experience (Optional)</label>
<input type="number" min="0" max="70">

<label data-t="clinicContact">Clinic / Hospital Contact Number</label>
<input type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>

<label data-t="password">Password</label>
<input type="password" id="doctorPassword" minlength="8" required>

<label data-t="confirm">Confirm Password</label>
<input type="password" id="doctorConfirm" minlength="8" required>

<button class="submit" type="submit" data-t="createDoctor">Create Doctor Account</button>
</form>

</div>
</div>

<footer>© 2026 MediAssist | <span data-t="rights">All Rights Reserved</span></footer>

const languageSelect=document.getElementById("language");

function renderSpecialties(lang){
 const select=document.getElementById("specialization");
 select.innerHTML="";
 const first=document.createElement("option");
 first.value="";
 first.textContent=words[lang].selectSpecialization;
 select.appendChild(first);
 specialties.forEach(item=>{
  const option=document.createElement("option");
  option.value=item[0];
  option.textContent=item[lang==="en"?0:lang==="gu"?1:2];
  select.appendChild(option);
 });
}

function changeLanguage(lang){
 localStorage.setItem("mediAssistLanguage",lang);
 document.querySelectorAll("[data-t]").forEach(el=>{
  const key=el.getAttribute("data-t");
  if(words[lang][key])el.textContent=words[lang][key];
 });
 renderSpecialties(lang);
}

languageSelect.value=localStorage.getItem("mediAssistLanguage")||"en";
languageSelect.addEventListener("change",()=>changeLanguage(languageSelect.value));

function showForm(type){
 document.getElementById("selection").style.display="none";
 document.getElementById("patientForm").classList.remove("active");
 document.getElementById("doctorForm").classList.remove("active");
 document.getElementById(type+"Form").classList.add("active");
}

function goBack(){
 document.getElementById("patientForm").classList.remove("active");
 document.getElementById("doctorForm").classList.remove("active");
 document.getElementById("selection").style.display="block";
}

function setupForm(formId,passwordId,confirmId){
 document.getElementById(formId).addEventListener("submit",function(event){
  event.preventDefault();
  const lang=languageSelect.value;
  const password=document.getElementById(passwordId).value;
  const confirm=document.getElementById(confirmId).value;
  if(password!==confirm){
   alert(words[lang].mismatch);
   return;
  }
  alert(words[lang].demo);
  this.reset();
 });
}

setupForm("patientForm","patientPassword","patientConfirm");
setupForm("doctorForm","doctorPassword","doctorConfirm");
changeLanguage(languageSelect.value);
</script>
