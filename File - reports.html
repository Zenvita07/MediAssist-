
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Medical Reports - MediAssist</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f7fb;
    color: #18334a;
}

header {
    background: #0879bd;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    font-size: 27px;
}

header p {
    margin-top: 6px;
    font-size: 14px;
}

.container {
    max-width: 750px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

h2 {
    color: #0879bd;
    margin-bottom: 17px;
    font-size: 21px;
}

label {
    display: block;
    font-weight: bold;
    margin: 13px 0 7px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd9e2;
    border-radius: 8px;
    font-size: 15px;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 12px;
}

.upload-btn {
    width: 100%;
    background: #0879bd;
    color: white;
    font-weight: bold;
}

.back-btn {
    background: #e3edf4;
    color: #18334a;
}

.report {
    border: 1px solid #dce8ef;
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
}

.report h3 {
    color: #0879bd;
    margin-bottom: 7px;
}

.report img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    margin-top: 12px;
    border-radius: 8px;
    background: #f3f6f8;
}

.view-btn {
    background: #0879bd;
    color: white;
}

.delete-btn {
    background: #e74c3c;
    color: white;
}

.empty {
    color: #718394;
    text-align: center;
    padding: 20px 5px;
}

.note {
    background: #e9f7ef;
    color: #237448;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
    <h1>💙 MediAssist</h1>
    <p>My Medical Reports</p>
</header>

<div class="container">

    <div class="card">
        <h2>📤 Upload Medical Report</h2>

        <label>Report Name</label>
        <input type="text" id="reportName"
        placeholder="Example: Blood Test Report">

        <label>Report Date</label>
        <input type="date" id="reportDate">

        <label>Select Report Photo</label>
        <input type="file" id="reportFile"
        accept="image/*">

        <button class="upload-btn" onclick="uploadReport()">
            Upload Report
        </button>

        <div class="note">
            You can upload medical report photos from your mobile.
            Only image files are accepted in this demo.
        </div>
    </div>

    <div class="card">
        <h2>📁 My Saved Reports</h2>
        <div id="reportsList">
            <p class="empty">No reports uploaded yet.</p>
        </div>
    </div>

    <button class="back-btn"
    onclick="window.location.href='patient-dashboard.html'">
        ← Back to Dashboard
    </button>

</div>

<script>
const STORAGE_KEY = "mediAssistReports";

function getReports() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (error) {
        return [];
    }
}

function saveReports(reports) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
}

function uploadReport() {
    const name = document.getElementById("reportName").value.trim();
    const date = document.getElementById("reportDate").value;
    const fileInput = document.getElementById("reportFile");
    const file = fileInput.files[0];

    if (!name || !date || !file) {
        alert("Please enter report name, date and select a photo.");
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("Please select an image file only.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        const reports = getReports();

        reports.unshift({
            id: Date.now().toString(),
            name: name,
            date: date,
            image: event.target.result
        });

        try {
            saveReports(reports);
            document.getElementById("reportName").value = "";
            document.getElementById("reportDate").value = "";
            fileInput.value = "";

            displayReports();
            alert("Report uploaded successfully!");
        } catch (error) {
            alert("Storage is full. Please remove some reports or use smaller images.");
        }
    };

    reader.onerror = function() {
        alert("Could not read this image. Please try again.");
    };

    reader.readAsDataURL(file);
}

function displayReports() {
    const reports = getReports();
    const list = document.getElementById("reportsList");

    if (reports.length === 0) {
        list.innerHTML = '<p class="empty">No reports uploaded yet.</p>';
        return;
    }

    list.innerHTML = "";

    reports.forEach(function(report) {
        const item = document.createElement("div");
        item.className = "report";

        const heading = document.createElement("h3");
        heading.textContent = "📄 " + report.name;

        const date = document.createElement("p");
        date.textContent = "Date: " + report.date;

        const image = document.createElement("img");
        image.src = report.image;
        image.alt = report.name;

        const viewButton = document.createElement("button");
        viewButton.className = "view-btn";
        viewButton.textContent = "View Report";
        viewButton.onclick = function() {
            window.open(report.image, "_blank");
        };

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function() {
            if (confirm("Are you sure you want to delete this report?")) {
                const updated = getReports().filter(function(r) {
                    return r.id !== report.id;
                });
                saveReports(updated);
                displayReports();
            }
        };

        item.appendChild(heading);
        item.appendChild(date);
        item.appendChild(image);
        item.appendChild(viewButton);
        item.appendChild(deleteButton);

        list.appendChild(item);
    });
}

displayReports();
</script>

</body>
</html>
